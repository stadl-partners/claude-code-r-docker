Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Info
# No LogFile: with -d tinyproxy logs to stderr, which `docker compose logs proxy` shows.

# Deny by default; only hosts matching an extended regex in allowlist.txt pass.
Filter "/etc/tinyproxy/allowlist.txt"
FilterExtended On
FilterDefaultDeny Yes
FilterCaseSensitive Off

# HTTPS only through CONNECT. Plain HTTP requests are still filtered by host.
ConnectPort 443
