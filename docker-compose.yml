services:
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        R_STACK: ${CLAUDE_R_STACK:-full}
    image: claude-r-sandbox:${CLAUDE_R_STACK:-full}
    depends_on: [proxy]
    # No host env vars are forwarded and nothing is read from an env file. The only way out of the
    # internal network is the allowlist proxy.
    environment:
      TERM: xterm-256color
      COLORTERM: ${COLORTERM-truecolor}
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1,proxy
      no_proxy: localhost,127.0.0.1,::1,proxy
    volumes:
      - ${WORKDIR:?set WORKDIR to the project directory to expose}:/workspace
      - claude-home:/home/claude
    working_dir: /workspace
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${CLAUDE_R_MEMORY:-8g}
    cpus: ${CLAUDE_R_CPUS:-4}
    networks: [sandbox]

  proxy:
    build: ./proxy
    image: claude-r-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks: [sandbox, egress]

networks:
  # internal: no route to the outside world; containers here can only reach each other.
  sandbox:
    internal: true
  egress: {}

volumes:
  claude-home:
